    <title>编辑简历资料 · 简历填充小助手</title>

    <header class="topbar">

        <span><strong>简历填充小助手</strong><small>你的多版本网申资料库</small></span>
      </div>
      <div id="saveState" class="save-state">尚未保存</div>
      <button id="saveButton" class="save-button">保存资料</button>
    </header>

    <main class="layout">
      <aside>
        <p class="eyebrow">资料目录</p>
        <nav id="sectionNav"></nav>
        <div class="privacy-card">
          <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"/></svg>
          <strong>本地隐私保护</strong>
          <p>资料仅保存在当前浏览器，不会上传到服务器。</p>

        <div class="data-actions">
          <button id="exportButton">导出备份</button>

          <button id="clearAnswerMemory" class="wide-action">清除已确认的补充答案</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
      </aside>

      <section class="content">
        <div class="intro">
          <span class="step">资料设置</span>
          <h1>管理并完善你的多版简历</h1>

          <button id="deleteProfileVersion" class="danger-action" type="button">删除</button>
        </section>
        <section class="resume-import-card">

          </div>
          <button id="resumeDropzone" class="dropzone" type="button">
            <svg viewBox="0 0 24 24"><path d="M7 3.75h7.6L19 8.15v12.1H7z"/><path d="M14.5 3.9v4.5H19M9.5 14h5M12 11.5v5"/></svg>
            <span><strong>拖拽简历到这里，或点击选择文件</strong><small>单个文件不超过 15 MB；暂不支持旧版 .doc 文件</small></span>

            <button id="chooseAnotherResume" type="button">重新导入</button>
          </div>
        </section>
        <form id="profileForm" autocomplete="off"></form>
      </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="../extension/vendor/mammoth/mammoth.browser.min.js"></script>
